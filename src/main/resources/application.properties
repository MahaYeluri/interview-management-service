spring.application.name=interview-management-system

server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:interviewdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/interview-scheduling-changelog.yaml

notification.base-url= http://localhost:8081

resilience4j.retry.instances.notificationClient.max-attempts=3
resilience4j.retry.instances.notificationClient.wait-duration=2s
resilience4j.retry.instances.notificationClient.enable-exponential-backoff=true
resilience4j.retry.instances.notificationClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.notificationClient.retry-exceptions=org.springframework.web.client.ResourceAccessException , org.springframework.web.client.HttpServerErrorException
